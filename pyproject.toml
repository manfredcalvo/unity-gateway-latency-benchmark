[project]
name = "ugbench"
version = "0.1.0"
description = "Reproducible latency benchmark: Amazon Bedrock direct vs. Bedrock through Databricks Unity Gateway (and its features)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.35",
    "databricks-sdk>=0.160",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
strands = ["strands-agents[anthropic]>=1.60", "anthropic[bedrock]>=0.70"]

[project.scripts]
ugbench = "ugbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ugbench"]
